<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jawad Ul Hadi, Backend Lead / Architect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Jawad Ul Hadi, Backend Lead / Architect</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#10162a}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.dim{fill:#535d77}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.hl{opacity:0;animation:hl 8s infinite}
@keyframes hl{0%,20%{opacity:.28}25%,100%{opacity:0}}
.orb{transform-origin:1056px 156px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{opacity:0;animation:fade .9s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

</style>
<rect width="1200" height="300" rx="16" fill="#ffffff" stroke="#d6dcea"/>

