                              <circle cx="1056" cy="156" r="84" fill="none" stroke="#d6dcea" stroke-width="2" stroke-dasharray="3 6"/>
                              <g class="orb">
                                <circle cx="1056" cy="72" r="8" fill="#10162a" stroke="#ffffff" stroke-width="3" transform="rotate(45 1056 156)"/>
                              </g>
