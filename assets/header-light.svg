                                <rect x="636" y="200" width="52" height="22" rx="4" fill="#eceff5" stroke="#334155" stroke-width="1"/>
                                <text x="662" y="215" fill="#1f2937">LLM
                                </text>
                              </g>
                            </g>
                            <!-- Bottom line -->
                              <g class="fade" style="animation-delay:.8s">
                                <text x="56" y="250" class="mono" font-size="13.5" fill="#535d77">Let's build something resilient together.
                                  <tspan class="caret" fill="#2d5bef"> ▍
                                  </tspan>
                                </text>
