<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jawad Ul Hadi, Backend Lead / Architect">
  <metadata>
    <c2pa:manifest>
    </c2pa:manifest>
  </metadata>
  <title>Jawad Ul Hadi, Backend Lead Engineer / Architect
  </title>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#10162a}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
    .dim{fill:#535d77}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    .hl{opacity:0;animation:hl 8s infinite}
    @keyframes hl{0%,20%{opacity:.28}25%,100%{opacity:0}}
    .orb{transform-origin:1056px 156px;animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1200" height="300" rx="16" fill="#ffffff" stroke="#d6dcea"/>
  <g class="fade" style="animation-delay:.2s">
    <text x="54" y="132" font-size="58" font-weight="800" letter-spacing="-1.5">Jawad Ul Hadi
    </text>
  </g>
  <!-- Subtitle as three pills -->
    <g class="fade" style="animation-delay:.4s">
      <g class="mono" font-size="13" font-weight="600" text-anchor="middle">
        <!-- Backend Lead Engineer -->
          <rect x="56" y="153" width="172" height="26" rx="6" fill="#eef1f8" stroke="#8894b3" stroke-width="1"/>
          <text x="142" y="170" fill="#1f2937">Backend Lead Engineer
          </text>
