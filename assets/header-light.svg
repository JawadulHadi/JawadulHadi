<g class="fade" style="animation-delay:.2s"><text x="54" y="132" font-size="58" font-weight="800" letter-spacing="-1.5">Jawad Ul Hadi</text></g>
<g class="fade" style="animation-delay:.4s"><text x="56" y="172" font-size="20" font-weight="600">Multi-tenant SaaS architecture · <tspan fill="#cc2f86">production AI that survives outages</tspan></text></g>
<g class="fade" style="animation-delay:.6s"><text x="56" y="214" class="mono" font-size="14"><tspan fill="#2d5bef">NestJS</tspan> · <tspan fill="#2d5bef">TypeScript</tspan> · <tspan fill="#0a9a8c">PostgreSQL</tspan> · <tspan fill="#0a9a8c">GraphQL</tspan> · <tspan fill="#c47600">BullMQ</tspan> · <tspan fill="#c47600">Redis</tspan> · <tspan fill="#cc2f86">RAG</tspan> · <tspan fill="#cc2f86">LLM</tspan></text></g>
<g class="fade" style="animation-delay:.8s"><text x="56" y="250" class="mono dim" font-size="13">$ case-study --open "Designing for AI Failure"<tspan class="caret" fill="#10162a"> ▍</tspan></text></g>
<circle cx="1056" cy="156" r="84" fill="none" stroke="#d6dcea" stroke-width="2" stroke-dasharray="3 6"/>
<g class="orb"><circle cx="1056" cy="72" r="8" fill="#10162a" stroke="#ffffff" stroke-width="3" transform="rotate(45 1056 156)"/></g>
<g transform="translate(1056.0 72.0)"><circle r="30" fill="#ffffff" stroke="#6b47ee" stroke-width="2"/>
<circle r="30" fill="#6b47ee" class="hl" style="animation-delay:0s"/>
<text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Plan</text></g><g transform="translate(1140.0 156.0)"><circle r="30" fill="#ffffff" stroke="#2d5bef" stroke-width="2"/>
<circle r="30" fill="#2d5bef" class="hl" style="animation-delay:2s"/>
<text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Act</text></g><g transform="translate(1056.0 240.0)"><circle r="30" fill="#ffffff" stroke="#0a9a8c" stroke-width="2"/>
<circle r="30" fill="#0a9a8c" class="hl" style="animation-delay:4s"/>
<text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Observe</text></g><g transform="translate(972.0 156.0)"><circle r="30" fill="#ffffff" stroke="#c47600" stroke-width="2"/>
<circle r="30" fill="#c47600" class="hl" style="animation-delay:6s"/>
<text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Reflect</text></g>
<text x="1056" y="160" text-anchor="middle" font-size="13" font-weight="700">agent loop</text>
