            <rect x="236" y="153" width="172" height="26" rx="6" fill="#e6eefb" stroke="#3178c6" stroke-width="1"/>
            <text x="322" y="170" fill="#1f4d8a">Backend Architecture
            </text>
            <!-- AI-First Systems Design -->
              <rect x="416" y="153" width="196" height="26" rx="6" fill="#e2f2f0" stroke="#0a9a8c" stroke-width="1"/>
              <text x="514" y="170" fill="#075e56">AI-First Systems Design
              </text>
            </g>
          </g>
          <!-- Core stack badges -->
            <g class="fade" style="animation-delay:.6s">
              <g class="mono" font-size="12.5" font-weight="600" text-anchor="middle">
                <!-- NestJS -->
                  <rect x="56" y="200" width="76" height="22" rx="4" fill="#fde7ec" stroke="#e0234e" stroke-width="1"/>
                  <text x="94" y="215" fill="#a3133a">NestJS
                  </text>
                  <!-- TypeScript -->
                    <rect x="138" y="200" width="96" height="22" rx="4" fill="#e6eefb" stroke="#3178c6" stroke-width="1"/>
                    <text x="186" y="215" fill="#1f4d8a">TypeScript
                    </text>
                    <!-- PostgreSQL -->
                      <rect x="240" y="200" width="96" height="22" rx="4" fill="#e7eefc" stroke="#4169e1" stroke-width="1"/>
                      <text x="288" y="215" fill="#24448f">PostgreSQL
                      </text>
                      <!-- GraphQL -->
                        <rect x="342" y="200" width="80" height="22" rx="4" fill="#fce4f3" stroke="#e10098" stroke-width="1"/>
                        <text x="382" y="215" fill="#a3006e">GraphQL
                        </text>
                        <!-- BullMQ -->
                          <rect x="428" y="200" width="76" height="22" rx="4" fill="#fbe6e3" stroke="#dc382d" stroke-width="1"/>
                          <text x="466" y="215" fill="#9e2419">BullMQ
                          </text>
                          <!-- Redis -->
                            <rect x="510" y="200" width="62" height="22" rx="4" fill="#fbe6e3" stroke="#dc382d" stroke-width="1"/>
                            <text x="541" y="215" fill="#9e2419">Redis
                            </text>
                            <!-- RAG -->
                              <rect x="578" y="200" width="52" height="22" rx="4" fill="#efe7fd" stroke="#7c3aed" stroke-width="1"/>
