<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Agent loop: plan, act, observe, reflect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Agent loop: plan, act, observe, reflect</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e9edf8}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.dim{fill:#9aa5c0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.hl{opacity:0;animation:hl 10s infinite}
@keyframes hl{0%,20%{opacity:.3}25%,100%{opacity:0}}
.orb{transform-origin:200px 210px;animation:spin 10s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spin{0%{transform:rotate(0)}25%{transform:rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
.ln{opacity:0;animation:ln 10s infinite}
@keyframes ln{0%{opacity:0;transform:translateX(-6px)}3%,88%{opacity:1;transform:none}96%,100%{opacity:0}}

</style>
<rect width="900" height="380" rx="16" fill="#111930" stroke="#26314f"/>

<text x="32" y="40" class="mono dim" font-size="11" letter-spacing="1">AGENT LOOP · ILLUSTRATIVE RUN</text>
<circle cx="200" cy="210" r="110" fill="none" stroke="#26314f" stroke-width="2" stroke-dasharray="3 6"/>
<g class="orb"><circle cx="200" cy="100" r="7" fill="#e9edf8"/></g>
<g transform="translate(200.0 100.0)"><circle r="32" fill="#111930" stroke="#a08bff" stroke-width="2"/>
<circle r="32" fill="#a08bff" class="hl" style="animation-delay:0.0s"/>
<text text-anchor="middle" y="4.5" font-size="13" font-weight="650">Plan</text>
</g><g transform="translate(310.0 210.0)"><circle r="32" fill="#111930" stroke="#7090ff" stroke-width="2"/>
<circle r="32" fill="#7090ff" class="hl" style="animation-delay:2.5s"/>
<text text-anchor="middle" y="0" font-size="13" font-weight="650">Act</text>
<text text-anchor="middle" y="13" class="mono dim" font-size="8.5">tool call</text></g><g transform="translate(200.0 320.0)"><circle r="32" fill="#111930" stroke="#2ccdbb" stroke-width="2"/>
<circle r="32" fill="#2ccdbb" class="hl" style="animation-delay:5.0s"/>
<text text-anchor="middle" y="4.5" font-size="13" font-weight="650">Observe</text>
</g><g transform="translate(90.0 210.0)"><circle r="32" fill="#111930" stroke="#f5b83d" stroke-width="2"/>
<circle r="32" fill="#f5b83d" class="hl" style="animation-delay:7.5s"/>
<text text-anchor="middle" y="4.5" font-size="13" font-weight="650">Reflect</text>
</g>
<text x="200" y="215" text-anchor="middle" font-size="15" font-weight="800">Plan → Act</text>
<text x="200" y="233" text-anchor="middle" font-size="15" font-weight="800">→ Observe</text>
<rect x="400" y="70" width="468" height="280" rx="12" fill="#1a2440"/>
<text x="420" y="96" class="mono dim" font-size="11">goal: screen a CV against a job description</text>
<g class="ln" style="animation-delay:0.0s"><text x="420" y="124" class="mono" font-size="13"><tspan fill="#a08bff" font-weight="700">plan    </tspan><tspan x="510">split the JD into must-have skills</tspan></text></g><g class="ln" style="animation-delay:1.25s"><text x="420" y="150" class="mono" font-size="13"><tspan fill="#7090ff" font-weight="700">act     </tspan><tspan x="510">tool ▸ parse_resume(cv.pdf)</tspan></text></g><g class="ln" style="animation-delay:2.5s"><text x="420" y="176" class="mono" font-size="13"><tspan fill="#2ccdbb" font-weight="700">observe </tspan><tspan x="510">skills extracted · 2 gaps flagged</tspan></text></g><g class="ln" style="animation-delay:3.75s"><text x="420" y="202" class="mono" font-size="13"><tspan fill="#f5b83d" font-weight="700">reflect </tspan><tspan x="510">gaps unclear → loop again</tspan></text></g><g class="ln" style="animation-delay:5.0s"><text x="420" y="228" class="mono" font-size="13"><tspan fill="#a08bff" font-weight="700">plan    </tspan><tspan x="510">check gaps against project history</tspan></text></g><g class="ln" style="animation-delay:6.25s"><text x="420" y="254" class="mono" font-size="13"><tspan fill="#7090ff" font-weight="700">act     </tspan><tspan x="510">tool ▸ rag.search("BullMQ, GraphQL")</tspan></text></g><g class="ln" style="animation-delay:7.5s"><text x="420" y="280" class="mono" font-size="13"><tspan fill="#2ccdbb" font-weight="700">observe </tspan><tspan x="510">3 matching passages</tspan></text></g><g class="ln" style="animation-delay:8.75s"><text x="420" y="306" class="mono" font-size="13"><tspan fill="#f5b83d" font-weight="700">reflect </tspan><tspan x="510">goal met ✓ respond</tspan></text></g>

</svg>
