<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jawad Ul Hadi, Backend Lead / Architect">
  <metadata>
    <c2pa:manifest>
    </c2pa:manifest>
  </metadata>
  <title>Jawad Ul Hadi, Backend Lead / Architect
  </title>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e9edf8}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
    .dim{fill:#9aa5c0}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    .hl{opacity:0;animation:hl 8s infinite}
    @keyframes hl{0%,20%{opacity:.28}25%,100%{opacity:0}}
    .orb{transform-origin:1056px 156px;animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1200" height="300" rx="16" fill="#111930" stroke="#26314f"/>
  <g class="fade" style="animation-delay:.2s">
    <text x="54" y="132" font-size="58" font-weight="800" letter-spacing="-1.5">Jawad Ul Hadi
    </text>
  </g>
  <!-- Subtitle as three pills -->
  <g class="fade" style="animation-delay:.4s">
    <g class="mono" font-size="13" font-weight="600" text-anchor="middle">
      <!-- Backend Lead Engineer -->
      <rect x="56" y="153" width="172" height="26" rx="6" fill="#1e2740" stroke="#8fa1c9" stroke-width="1"/>
      <text x="142" y="170" fill="#d4ddef">Backend Lead Engineer</text>

      <!-- Backend Architecture -->
      <rect x="236" y="153" width="172" height="26" rx="6" fill="#132437" stroke="#6aa9ff" stroke-width="1"/>
      <text x="322" y="170" fill="#a7c9ff">Backend Architecture</text>

      <!-- AI-First Systems Design -->
      <rect x="416" y="153" width="196" height="26" rx="6" fill="#0d2b2a" stroke="#2ccdbb" stroke-width="1"/>
      <text x="514" y="170" fill="#9be8de">AI-First Systems Design</text>
    </g>
  </g>
    <!-- Core stack badges -->
      <g class="fade" style="animation-delay:.6s">
        <g class="mono" font-size="12.5" font-weight="600" text-anchor="middle">
          <!-- NestJS -->
            <rect x="56" y="200" width="76" height="22" rx="4" fill="#3a1a26" stroke="#ff6b8f" stroke-width="1"/>
            <text x="94" y="215" fill="#ffb3c4">NestJS
            </text>
            <!-- TypeScript -->
              <rect x="138" y="200" width="96" height="22" rx="4" fill="#132437" stroke="#6aa9ff" stroke-width="1"/>
              <text x="186" y="215" fill="#a7c9ff">TypeScript
              </text>
              <!-- PostgreSQL -->
                <rect x="240" y="200" width="96" height="22" rx="4" fill="#152238" stroke="#7ea3ff" stroke-width="1"/>
                <text x="288" y="215" fill="#b3c7ff">PostgreSQL
                </text>
                <!-- GraphQL -->
                  <rect x="342" y="200" width="80" height="22" rx="4" fill="#361031" stroke="#ff5cc1" stroke-width="1"/>
                  <text x="382" y="215" fill="#ffb0e0">GraphQL
                  </text>
                  <!-- BullMQ -->
                    <rect x="428" y="200" width="76" height="22" rx="4" fill="#3a1714" stroke="#ff7a6b" stroke-width="1"/>
                    <text x="466" y="215" fill="#ffb3a6">BullMQ
                    </text>
                    <!-- Redis -->
                      <rect x="510" y="200" width="62" height="22" rx="4" fill="#3a1714" stroke="#ff7a6b" stroke-width="1"/>
                      <text x="541" y="215" fill="#ffb3a6">Redis
                      </text>
                      <!-- RAG -->
                        <rect x="578" y="200" width="52" height="22" rx="4" fill="#251438" stroke="#a08bff" stroke-width="1"/>
                        <text x="604" y="215" fill="#cdbfff">RAG
                        </text>
                        <!-- LLM -->
                          <rect x="636" y="200" width="52" height="22" rx="4" fill="#1e2740" stroke="#8fa1c9" stroke-width="1"/>
                          <text x="662" y="215" fill="#d4ddef">LLM
                          </text>
                        </g>
                      </g>
                      <!-- Bottom line -->
                        <g class="fade" style="animation-delay:.8s">
                          <text x="56" y="250" class="mono" font-size="13.5" fill="#535d77">Let's build something resilient together.
                            <tspan class="caret" fill="#2d5bef"> ▍
                            </tspan>
                          </text>
                        </g>
                        <circle cx="1056" cy="156" r="84" fill="none" stroke="#26314f" stroke-width="2" stroke-dasharray="3 6"/>
                        <g class="orb">
                          <circle cx="1056" cy="72" r="8" fill="#e9edf8" stroke="#111930" stroke-width="3" transform="rotate(45 1056 156)"/>
                        </g>
                        <g transform="translate(1056.0 72.0)">
                          <circle r="30" fill="#111930" stroke="#a08bff" stroke-width="2"/>
                          <circle r="30" fill="#a08bff" class="hl" style="animation-delay:0s"/>
                          <text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Plan
                          </text>
                        </g>
                        <g transform="translate(1140.0 156.0)">
                          <circle r="30" fill="#111930" stroke="#7090ff" stroke-width="2"/>
                          <circle r="30" fill="#7090ff" class="hl" style="animation-delay:2s"/>
                          <text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Act
                          </text>
                        </g>
                        <g transform="translate(1056.0 240.0)">
                          <circle r="30" fill="#111930" stroke="#2ccdbb" stroke-width="2"/>
                          <circle r="30" fill="#2ccdbb" class="hl" style="animation-delay:4s"/>
                          <text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Observe
                          </text>
                        </g>
                        <g transform="translate(972.0 156.0)">
                          <circle r="30" fill="#111930" stroke="#f5b83d" stroke-width="2"/>
                          <circle r="30" fill="#f5b83d" class="hl" style="animation-delay:6s"/>
                          <text text-anchor="middle" y="4.5" font-size="12.5" font-weight="650">Reflect
                          </text>
                        </g>
                        <text x="1056" y="160" text-anchor="middle" font-size="13" font-weight="700">agent loop
                        </text>
                        <text x="1056" y="176" text-anchor="middle" class="mono dim" font-size="9.5">until goal met
                        </text>
                      </svg>